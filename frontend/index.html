<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Senja 3D Wind</title>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>

      <div id="ui">
        <nav class="panel view-switch" id="views" aria-label="Views"></nav>

        <div id="side">
          <header class="panel" id="info">
            <h1>Senja 3D Wind</h1>
            <div class="meta">
              <span id="model-name"></span>
              <span id="init-time"></span>
            </div>
            <div class="desc" id="model-desc"></div>
          </header>

          <section class="panel" id="query-panel">
            <h2>Query point</h2>
            <div id="query"></div>
          </section>

          <aside class="panel" id="controls">
            <section>
              <h2>Data</h2>
              <label class="field">Dataset <select id="dataset" aria-label="Dataset"></select></label>
              <div class="desc small" id="terrain-src"></div>
            </section>
            <section>
              <h2>Layers</h2>
              <div id="levels"></div>
            </section>
            <section>
              <h2>Display</h2>
              <label class="check"><input id="show-surface" type="checkbox" checked /> Level surfaces</label>
              <label class="check"><input id="smooth" type="checkbox" checked /> Smooth time interpolation</label>
              <button id="reset-camera" class="wide">Reset camera</button>
            </section>
            <dl class="hint keys">
              <dt>Left-drag</dt><dd>rotate</dd>
              <dt>Right-drag</dt><dd>pan</dd>
              <dt>Wheel</dt><dd>zoom</dd>
              <dt>Click</dt><dd>inspect</dd>
            </dl>
          </aside>
        </div>

        <div class="fps" id="fps"></div>
        <aside class="panel" id="inspector" hidden></aside>
        <div class="panel" id="legend"></div>
        <footer class="panel" id="timeline"></footer>
      </div>

      <div id="loading" hidden><div class="spinner"></div><span>Loading…</span></div>
      <div id="error" role="alert" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
